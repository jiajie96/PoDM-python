[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "podm"
version = "0.1.0"
description = "PoDM: Point-of-Departure Diffusion Model for structural image synthesis"
authors = [{ name = "Jiajie Fan" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0,<2.0",
    "scipy>=1.10.0",
    "scikit-image>=0.21.0",
    "Pillow>=9.0.0",
    "matplotlib>=3.7.0",
    "opencv-python>=4.8.0",
    "pyyaml>=6.0",
    "tqdm>=4.65.0",
    "torchvision>=0.15.0",
    "imageio>=2.31.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.1.0",
    "pre-commit>=3.4",
]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501", "F401", "F841"]
